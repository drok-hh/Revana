<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ابتسم يظهر القلب</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      font-family: system-ui, -apple-system, sans-serif;
    }
    #video {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      z-index: 1;
    }
    #heart {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%) scale(0);
      font-size: 180px;
      color: #ff1744;
      z-index: 10;
      opacity: 0;
      transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      pointer-events: none;
      text-shadow: 0 0 40px rgba(255, 23, 68, 0.8);
    }
    #heart.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
      animation: heartbeat 0.8s ease-in-out infinite;
    }
    @keyframes heartbeat {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      25% { transform: translate(-50%, -50%) scale(1.15); }
      50% { transform: translate(-50%, -50%) scale(1); }
      75% { transform: translate(-50%, -50%) scale(1.1); }
    }
    #status {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.75);
      color: white;
      padding: 12px 24px;
      border-radius: 50px;
      font-size: 16px;
      z-index: 20;
      backdrop-filter: blur(10px);
      text-align: center;
    }
    #error-screen {
      position: fixed;
      inset: 0;
      background: #111;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      z-index: 100;
      padding: 30px;
      text-align: center;
    }
    #error-screen .icon { font-size: 60px; margin-bottom: 20px; }
    #error-screen h2 { color: #ff5252; margin-bottom: 15px; font-size: 22px; }
    #error-screen p { color: #bbb; font-size: 15px; line-height: 1.6; margin-bottom: 25px; }
    #retry-btn {
      background: #ff1744;
      color: white;
      border: none;
      padding: 14px 32px;
      border-radius: 50px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    #loading {
      position: fixed;
      inset: 0;
      background: #111;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      z-index: 100;
      gap: 20px;
    }
    .spinner {
      width: 50px; height: 50px;
      border: 4px solid rgba(255,255,255,0.2);
      border-top-color: #ff1744;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div id="loading">
    <div class="spinner"></div>
    <div>جاري تحميل الكاميرا...</div>
  </div>

  <div id="error-screen">
    <div class="icon">📷</div>
    <h2>لا يمكن الوصول للكاميرا</h2>
    <p>
      المتصفح يمنع الكاميرا لأن الصفحة مش على HTTPS.<br><br>
      <strong>الحل السريع:</strong><br>
      ارفع الملف على tiiny.host أو netlify<br>
      وافتح الرابط من جوالك.
    </p>
    <button id="retry-btn">حاول مرة أخرى</button>
  </div>

  <video id="video" autoplay muted playsinline></video>
  <div id="heart">❤️</div>
  <div id="status">ابتسم ليظهر القلب ❤️</div>

  <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>

  <script>
    const video = document.getElementById('video');
    const heart = document.getElementById('heart');
    const status = document.getElementById('status');
    const loading = document.getElementById('loading');
    const errorScreen = document.getElementById('error-screen');
    const retryBtn = document.getElementById('retry-btn');

    let isSmiling = false;
    let modelsLoaded = false;

    async function loadModels() {
      const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';
      await Promise.all([
        faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
        faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
        faceapi.nets.faceExpressionNet.loadFromUri(MODEL_URL)
      ]);
      modelsLoaded = true;
    }

    async function startCamera() {
      loading.style.display = 'flex';
      errorScreen.style.display = 'none';

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
            facingMode: 'user',
            width: { ideal: 1280 },
            height: { ideal: 720 }
          }
        });

        video.srcObject = stream;
        await video.play();

        loading.style.display = 'none';
        status.textContent = 'ابتسم ليظهر القلب ❤️';
        startDetectionLoop();

      } catch (err) {
        console.error(err);
        loading.style.display = 'none';
        errorScreen.style.display = 'flex';
      }
    }

    async function detectSmile() {
      if (!modelsLoaded || !video.srcObject) return;

      try {
        const detections = await faceapi
          .detectAllFaces(video, new faceapi.TinyFaceDetectorOptions({
            inputSize: 224,
            scoreThreshold: 0.5
          }))
          .withFaceLandmarks()
          .withFaceExpressions();

        if (detections.length > 0) {
          const happy = detections[0].expressions.happy;
          if (happy > 0.65) {
            if (!isSmiling) {
              isSmiling = true;
              heart.classList.add('show');
              status.textContent = '😊 ابتسامة جميلة!';
            }
          } else {
            if (isSmiling) {
              isSmiling = false;
              heart.classList.remove('show');
              status.textContent = 'ابتسم ليظهر القلب ❤️';
            }
          }
        } else {
          if (isSmiling) {
            isSmiling = false;
            heart.classList.remove('show');
          }
          status.textContent = 'ضع وجهك أمام الكاميرا';
        }
      } catch (e) {}
    }

    function startDetectionLoop() {
      setInterval(detectSmile, 300);
    }

    retryBtn.addEventListener('click', startCamera);

    async function init() {
      await loadModels();
      await startCamera();
    }

    init();
  </script>
</body>
</html>
